spring:
  application:
    name: tuition-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/tuition_db
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

server:
  port: 8080
